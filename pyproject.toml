[project]
name = "context-forge"
version = "0.1.0"
description = "Local-first compiler for development-session knowledge"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "python-frontmatter>=1.1,<2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]

[project.scripts]
forge = "context_forge.cli:app"
forge-mcp = "context_forge.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]
