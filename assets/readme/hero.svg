<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="hero-title">code-mentor — Claude 改你的代码前先问清楚</title>
  <desc id="hero-desc">一个给初级开发者的主动型 mentor。v3.1：**约束你**（不让你"我懂了/直接干/按这个改就行"+ 反问依据 + 仍确认黑名单）+ **带人成长**（4 mode 观察/讲解/共学/复盘 + 6 mentor 动作 + 沉淀 + 复访）。**不写代码**——写代码是用户的活。右侧展示 user/mentor 互动：用户说"我懂了" → mentor 主动举反例核对 → 用户说"搞定" → mentor 主动问"最大学习"。</desc>

  <!-- ============ Background ============ -->
  <rect width="1200" height="360" fill="#FAFAF9"/>

  <!-- 极细的水平尺规（视觉锚，editor 美学） -->
  <line x1="64" y1="44" x2="64" y2="316" stroke="#0F1419" stroke-width="1" opacity="0.18"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#6E7681" opacity="0.7">
    <text x="50" y="48"  text-anchor="end">01</text>
    <text x="50" y="100" text-anchor="end">02</text>
    <text x="50" y="180" text-anchor="end">03</text>
    <text x="50" y="232" text-anchor="end">04</text>
  </g>

  <!-- ============ Left: identity ============ -->
  <g transform="translate(96 64)">
    <!-- eyebrow -->
    <text x="0" y="0" font-size="14" font-weight="600" fill="#6E7681"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          letter-spacing="2">CLAUDE SKILL · v3.1</text>

    <!-- H1 -->
    <text x="0" y="68" font-size="64" font-weight="700" fill="#0F1419" letter-spacing="-1.5">code-mentor</text>

    <!-- 一句话价值 -->
    <text x="0" y="118" font-size="20" font-weight="500" fill="#1F2328">让 Claude 在改你的代码之前先问清楚、改的时候等你点头、</text>
    <text x="0" y="146" font-size="20" font-weight="500" fill="#1F2328">改完之后走完收尾 —— 而不是默默接管代码库。</text>

    <!-- STOP pill + mentor tagline -->
    <g transform="translate(0 192)">
      <rect x="0" y="-22" width="44" height="28" rx="4" fill="#DC2626"/>
      <text x="22" y="-2" font-size="14" font-weight="700" fill="#FAFAF9" text-anchor="middle" letter-spacing="1">STOP</text>
      <text x="56" y="-2" font-size="18" font-weight="500" fill="#0F1419">你留在主导位置，Claude 跟着节奏走</text>
    </g>

    <!-- metadata row -->
    <g transform="translate(0 244)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#6E7681">
      <text x="0"   y="0" fill="#0F1419" font-weight="600">constrains user</text>
      <text x="130" y="0">·</text>
      <text x="144" y="0" fill="#0F1419" font-weight="600">4 modes</text>
      <text x="218" y="0">·</text>
      <text x="232" y="0" fill="#0F1419" font-weight="600">6 actions</text>
      <text x="314" y="0">·</text>
      <text x="328" y="0" fill="#0F1419" font-weight="600">no-code mentor</text>
      <text x="460" y="0">·</text>
      <text x="474" y="0" fill="#0F1419" font-weight="600">vault integrated</text>
      <text x="612" y="0">·</text>
      <text x="626" y="0">v3.1 (2026-08-10)</text>
    </g>
  </g>

  <!-- ============ Right: terminal transcript ============ -->
  <g transform="translate(740 56)">
    <!-- terminal window -->
    <rect x="0" y="0" width="396" height="248" rx="12" fill="#0F1419" stroke="#1F2328"/>
    <!-- title bar -->
    <rect x="0" y="0" width="396" height="34" rx="12" fill="#1F2328"/>
    <rect x="0" y="22" width="396" height="12" fill="#1F2328"/>
    <!-- traffic lights -->
    <circle cx="22" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="42" cy="17" r="5" fill="#FEBC2E"/>
    <circle cx="62" cy="17" r="5" fill="#28C840"/>
    <text x="198" y="22" font-size="12" fill="#6E7681" text-anchor="middle"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">claude · mentor mode</text>

    <!-- transcript body -->
    <g transform="translate(20 60)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">

      <!-- USER prompt 1 -->
      <text y="0"  fill="#7EE787">user ›</text>
      <text x="58" y="0" fill="#FAFAF9">帮我写个登录 handler</text>

      <!-- MENTOR reply 1 (clarify) -->
      <text y="28" fill="#8B95A1">mentor ›</text>
      <text x="68" y="28" fill="#FAFAF9">先问 3 个问题：</text>
      <text y="48" fill="#FAFAF9">  1. 任务是？</text>
      <text y="66" fill="#FAFAF9">  2. 完成标准？</text>
      <text y="84" fill="#FAFAF9">  3. 涉及哪些文件？</text>

      <!-- USER prompt 2 (brake) -->
      <text y="118" fill="#7EE787">user ›</text>
      <text x="58" y="118" fill="#DC2626" font-weight="700">停，我没懂</text>

      <!-- MENTOR reply 2 (brake response) -->
      <text y="146" fill="#8B95A1">mentor ›</text>
      <text x="68" y="146" fill="#FAFAF9">🛑 不评判，换比喻重讲一次</text>

      <!-- status pill -->
      <g transform="translate(0 168)">
        <rect x="0" y="0" width="356" height="36" rx="6" fill="#1F2328" stroke="#DC2626" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#DC2626"/>
        <text x="32" y="22" font-size="12" fill="#FAFAF9">刹车口令即生效 · no-confirmation 下也成立</text>
      </g>
    </g>
  </g>

  <!-- ============ Bottom rail: trace markers (mentor / user / stop) ============ -->
  <g transform="translate(96 332)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6E7681" opacity="0.85">
    <circle cx="6" cy="-3" r="4" fill="#7EE787"/>
    <text x="18" y="0">user</text>
    <circle cx="76" cy="-3" r="4" fill="#8B95A1"/>
    <text x="88" y="0">mentor</text>
    <rect x="160" y="-9" width="14" height="12" rx="2" fill="#DC2626"/>
    <text x="180" y="0">stop · 等点头 · 改前确认</text>
  </g>
</svg>
